# Two EasyStarts read by one ESP32 (M5Stack AtomS3R here).
#
# Verified working, polled concurrently at 10s with no contention. The limit is
# RF range, not the ESP32: the node needs usable RSSI to BOTH units. The RSSI
# sensors are a placement aid - see README.md.
substitutions:
  name: easystart-dual
  mac_upstairs: "AA:BB:CC:DD:EE:FF"   # EasyStart_XXXX
  mac_downstairs: "11:22:33:44:55:66"   # EasyStart_YYYY

esphome:
  name: ${name}
  friendly_name: EasyStart
  # One HA device per unit, so the entities group under the A/C they belong to
  # instead of all hanging off the ESP32.
  devices:
    - id: dev_upstairs
      name: Upstairs EasyStart
    - id: dev_downstairs
      name: Downstairs EasyStart

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

esp32_ble:
  max_connections: 3

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: ${mac_upstairs}
    id: ble_upstairs
  - mac_address: ${mac_downstairs}
    id: ble_downstairs

easystart:
  - id: hub_upstairs
    ble_client_id: ble_upstairs
    update_interval: 10s
  - id: hub_downstairs
    ble_client_id: ble_downstairs
    update_interval: 10s

sensor:
  - platform: easystart
    easystart_id: hub_upstairs
    live_current:
      name: "Current"
      device_id: dev_upstairs
    last_start_peak:
      name: "Last Start Peak"
      device_id: dev_upstairs
    line_frequency:
      name: "Line Frequency"
      device_id: dev_upstairs
    total_starts:
      name: "Total Starts"
      device_id: dev_upstairs
    total_faults:
      name: "Total Faults"
      device_id: dev_upstairs
  - platform: ble_client
    ble_client_id: ble_upstairs
    type: rssi
    name: "RSSI"
    device_id: dev_upstairs
    update_interval: 120s
    entity_category: diagnostic
  - platform: ble_client
    ble_client_id: ble_downstairs
    type: rssi
    name: "RSSI"
    device_id: dev_downstairs
    update_interval: 120s
    entity_category: diagnostic
  - platform: easystart
    easystart_id: hub_downstairs
    live_current:
      name: "Current"
      device_id: dev_downstairs
    last_start_peak:
      name: "Last Start Peak"
      device_id: dev_downstairs
    line_frequency:
      name: "Line Frequency"
      device_id: dev_downstairs
    total_starts:
      name: "Total Starts"
      device_id: dev_downstairs
    total_faults:
      name: "Total Faults"
      device_id: dev_downstairs

text_sensor:
  - platform: easystart
    easystart_id: hub_upstairs
    system_state:
      name: "State"
      device_id: dev_upstairs
    model:
      name: "Model"
      device_id: dev_upstairs
    firmware:
      name: "Firmware"
      device_id: dev_upstairs
  - platform: easystart
    easystart_id: hub_downstairs
    system_state:
      name: "State"
      device_id: dev_downstairs
    model:
      name: "Model"
      device_id: dev_downstairs
    firmware:
      name: "Firmware"
      device_id: dev_downstairs

binary_sensor:
  - platform: easystart
    easystart_id: hub_upstairs
    fault:
      name: "Fault"
      device_id: dev_upstairs
  - platform: easystart
    easystart_id: hub_downstairs
    fault:
      name: "Fault"
      device_id: dev_downstairs
